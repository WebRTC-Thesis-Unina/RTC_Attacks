services:
  ttyd:
    container_name: ttyd
    build: ./ttyd
    image: ttyd
    command: ttyd --writable bash
    ports:
      - 7681:7681
    stdin_open: true
    tty: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  collector:
    container_name: collector
    build: ./collector
    image: collector
    network_mode: host
    privileged: true
    pid: host
    volumes:
      - ./captures:/captures
      - /var/run/docker.sock:/var/run/docker.sock:ro
    stdin_open: true
    tty: true
    entrypoint: /bin/bash
    command: /opt/collector/run.sh